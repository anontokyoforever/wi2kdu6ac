<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证访问</title>
    <meta name="description" content="请输入访问密码以继续">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 本页专用样式 */
        .verify-title {
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 600;
            color: var(--text-heading);
            margin-bottom: 6px;
        }

        .verify-sub {
            font-size: 1rem;
            color: var(--text-muted);
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin: 10px 0 8px;
        }

        .input-group input {
            width: 100%;
            max-width: 300px;
            padding: 12px 18px;
            border-radius: var(--radius-pill);
            border: 1.5px solid var(--card-border);
            background: rgba(255, 255, 255, 0.119);
            font-size: 1rem;
            font-family: inherit;
            color: var(--text-body);
            text-align: center;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
            backdrop-filter: blur(4px);
        }

        .input-group input:focus {
            border-color: var(--color-primary-deep);
            box-shadow: 0 0 0 3px rgba(240, 138, 158, 0.25);
        }

        .input-group input::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 6px;
        }

        .btn-secondary {
            background: rgba(200, 180, 190, 0.25);
            border-color: rgba(160, 140, 150, 0.3);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background: rgba(200, 180, 190, 0.4);
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            opacity: 0.7;
            margin-top: 6px;
        }

        @media (max-width: 380px) {
            .btn-group {
                flex-direction: column;
                align-items: center;
            }

            .btn-primary {
                min-width: 140px;
            }
        }
    </style>
</head>

<body>
    <canvas id="sakura-canvas" aria-hidden="true"></canvas>

    <main class="main-container">
        <article class="card">
            <h2 class="verify-title">访问验证</h2>
            <p class="verify-sub">请输入密码以继续</p>
            <div class="input-group">
                <input type="password" id="passwordInput" placeholder="输入密码" autofocus>
                <div class="btn-group">
                    <button id="confirmBtn" class="btn-primary">确认访问</button>
                    <button id="backBtn" class="btn-primary btn-secondary">返回上页</button>
                </div>
            </div>
        </article>

        <footer class="footer-card">
            <span class="footer-decor" aria-hidden="true">🌸</span>
            <span id="weight-font">&copy;<span id="year"></span></span>&nbsp;<span>07210000.xyz</span>
            <span class="footer-decor" aria-hidden="true">🌸</span>
        </footer>
    </main>

    <script>
        (function () {
            const yearEl = document.getElementById('year');
            if (yearEl) yearEl.textContent = new Date().getFullYear();

            const canvas = document.getElementById('sakura-canvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                let width, height;
                const petals = [];
                const CONFIG = {
                    maxPetals: 55,
                    colors: [
                        'rgba(255, 183, 197, 0.8)', 'rgba(255, 200, 210, 0.75)',
                        'rgba(255, 170, 188, 0.78)', 'rgba(255, 190, 200, 0.72)',
                        'rgba(255, 210, 220, 0.7)', 'rgba(255, 178, 192, 0.76)'
                    ],
                    sizeRange: [6, 20],
                    speedYRange: [0.4, 2.0],
                    waveAmpRange: [0.3, 1.5]
                };

                function resize() {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    canvas.width = width;
                    canvas.height = height;
                }

                class SakuraPetal {
                    constructor(randomY = true) { this.reset(randomY); }
                    reset(randomY = true) {
                        this.x = Math.random() * width * 1.1 - width * 0.05;
                        this.y = randomY ? Math.random() * height * 1.1 - height * 0.05 : -30 - Math.random() * 60;
                        this.size = CONFIG.sizeRange[0] + Math.random() * (CONFIG.sizeRange[1] - CONFIG.sizeRange[0]);
                        this.color = CONFIG.colors[Math.floor(Math.random() * CONFIG.colors.length)];
                        this.speedY = CONFIG.speedYRange[0] + Math.random() * (CONFIG.speedYRange[1] - CONFIG.speedYRange[0]);
                        this.speedX = -0.3 + Math.random() * 0.6;
                        this.rotation = Math.random() * Math.PI * 2;
                        this.rotationSpeed = (Math.random() - 0.5) * 0.03;
                        this.waveAmp = CONFIG.waveAmpRange[0] + Math.random() * (CONFIG.waveAmpRange[1] - CONFIG.waveAmpRange[0]);
                        this.waveFreq = 0.01 + Math.random() * 0.03;
                        this.waveOffset = Math.random() * Math.PI * 2;
                        this.opacityVar = 0.85 + Math.random() * 0.15;
                        this.time = Math.random() * 1000;
                    }
                    update() {
                        this.time += 1;
                        this.y += this.speedY;
                        this.x += this.speedX + Math.sin(this.time * this.waveFreq + this.waveOffset) * this.waveAmp;
                        this.rotation += this.rotationSpeed;
                        if (this.y > height + 40 || this.x < -60 || this.x > width + 60) {
                            this.reset(false);
                        }
                    }
                    draw(ctx) {
                        ctx.save();
                        ctx.translate(this.x, this.y);
                        ctx.rotate(this.rotation);
                        ctx.globalAlpha = this.opacityVar;
                        const s = this.size;
                        const w = s * 0.55;
                        const h = s;
                        ctx.beginPath();
                        ctx.moveTo(0, -h * 0.45);
                        ctx.bezierCurveTo(w * 0.9, -h * 0.25, w * 0.95, h * 0.15, w * 0.35, h * 0.45);
                        ctx.bezierCurveTo(w * 0.15, h * 0.55, 0, h * 0.2, 0, -h * 0.45);
                        ctx.bezierCurveTo(-w * 0.15, h * 0.55, -w * 0.35, h * 0.45, -w * 0.95, h * 0.15);
                        ctx.bezierCurveTo(-w * 0.9, -h * 0.25, 0, -h * 0.45, 0, -h * 0.45);
                        ctx.closePath();
                        const grad = ctx.createRadialGradient(0, -h * 0.05, s * 0.05, 0, h * 0.1, s * 0.75);
                        grad.addColorStop(0, this.color.replace(/[\d.]+\)$/, '0.95)'));
                        grad.addColorStop(0.5, this.color);
                        grad.addColorStop(1, this.color.replace(/[\d.]+\)$/, '0.35)'));
                        ctx.fillStyle = grad;
                        ctx.fill();
                        ctx.strokeStyle = this.color.replace(/[\d.]+\)$/, '0.45)');
                        ctx.lineWidth = 0.4;
                        ctx.beginPath();
                        ctx.moveTo(0, -h * 0.4);
                        ctx.lineTo(0, h * 0.25);
                        ctx.stroke();
                        ctx.fillStyle = 'rgba(255,255,255,0.35)';
                        ctx.beginPath();
                        ctx.arc(-w * 0.2, -h * 0.1, s * 0.12, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    }
                }

                function init() {
                    petals.length = 0;
                    for (let i = 0; i < CONFIG.maxPetals; i++) {
                        petals.push(new SakuraPetal(true));
                    }
                }

                function animate() {
                    ctx.clearRect(0, 0, width, height);
                    for (const petal of petals) {
                        petal.update();
                        petal.draw(ctx);
                    }
                    requestAnimationFrame(animate);
                }

                resize();
                init();
                animate();

                let resizeTimer;
                window.addEventListener('resize', () => {
                    clearTimeout(resizeTimer);
                    resizeTimer = setTimeout(resize, 100);
                });
            }

            const PAYLOAD = {
                salt: "khRomywFXtsvqXHoIuCguw==",
                iv:   "A+FPZ1aX2SoLT+gp",
                data: "HwT2LnEjaKlCOi8k54jz477AUKcuEMnmka6msC2Xe9Od+k8VEzhv4/KHLMCu8w=="
            };

            async function unlock(password) {
                const enc = new TextEncoder();
                const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
                try {
                    const keyMaterial = await crypto.subtle.importKey(
                        "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
                    );
                    const key = await crypto.subtle.deriveKey(
                        { name: "PBKDF2", salt: b64d(PAYLOAD.salt), iterations: 600000, hash: "SHA-256" },
                        keyMaterial,
                        { name: "AES-GCM", length: 256 },
                        false, ["decrypt"]
                    );
                    const plain = await crypto.subtle.decrypt(
                        { name: "AES-GCM", iv: b64d(PAYLOAD.iv) },
                        key,
                        b64d(PAYLOAD.data)
                    );
                    return new TextDecoder().decode(plain);
                } catch {
                    return null;
                }
            }

            async function handleConfirm() {
                const btn = confirmBtn;
                btn.disabled = true;
                btn.textContent = "验证中...";
                const target = await unlock(pwdInput.value);
                btn.disabled = false;
                btn.textContent = "确认访问";
                if (target) {
                    window.location.href = target;
                } else {
                    alert('密码错误');
                    pwdInput.value = '';
                    pwdInput.focus();
                }
            }

            const pwdInput = document.getElementById('passwordInput');
            const confirmBtn = document.getElementById('confirmBtn');
            const backBtn = document.getElementById('backBtn');

            function goBack() {
                window.location.href = 'index.html';
            }

            confirmBtn.addEventListener('click', handleConfirm);
            backBtn.addEventListener('click', goBack);
            pwdInput.addEventListener('keyup', (e) => {
                if (e.key === 'Enter') handleConfirm();
            });
            pwdInput.focus();
        })();
    </script>
</body>

</html>
